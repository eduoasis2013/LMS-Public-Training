<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Edu Oasis LMS — Latihan Awam & e-TRiS (HRD Corp)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg1:#04141d; --bg2:#062a2f; --bg3:#0a3d3a;
  --glass:rgba(255,255,255,0.07);
  --glass2:rgba(255,255,255,0.11);
  --glass-brd:rgba(255,255,255,0.16);
  --primary:#10b981; --primary2:#22d3ee; --primary-d:#0e7c66;
  --accent:#f59e0b; --accent2:#fb7185;
  --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --info:#38bdf8;
  --txt:#eaf6f4; --txt-dim:#a7c2bd; --txt-mut:#6f8d88;
  --radius:18px; --radius-sm:12px;
  --shadow:0 18px 50px -12px rgba(0,0,0,.55);
  --grad:linear-gradient(135deg,var(--primary),var(--primary2));
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Plus Jakarta Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-size:15px; font-weight:400; line-height:1.5;
  color:var(--txt); min-height:100vh;
  background:
    radial-gradient(1100px 700px at 12% -10%, rgba(34,211,238,.18), transparent 60%),
    radial-gradient(900px 600px at 100% 0%, rgba(16,185,129,.20), transparent 55%),
    radial-gradient(700px 700px at 60% 120%, rgba(245,158,11,.10), transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--primary2);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
.glass{
  background:var(--glass); backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  border:1px solid var(--glass-brd); border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.glass-strong{background:var(--glass2);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--glass-brd);border-radius:var(--radius);box-shadow:var(--shadow)}
.row{display:flex;gap:14px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:14px}
.between{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.center{display:flex;align-items:center;gap:10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.auto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}
.muted{color:var(--txt-dim)}
.mut{color:var(--txt-mut)}
.sm{font-size:12px;font-weight:500}
.xs{font-size:12px;font-weight:500}
.lg{font-size:18px}
.xl{font-size:28px;font-weight:700;letter-spacing:-.4px;line-height:1.25}
.h2{font-size:20px;font-weight:600;margin:0;line-height:1.3}
.h3{font-size:16px;font-weight:600;margin:0;line-height:1.35}
.pri{color:var(--primary2)}
.accent{color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:var(--txt)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;border:1px solid transparent}
.b-ok{background:rgba(34,197,94,.16);color:#86efac;border-color:rgba(34,197,94,.35)}
.b-warn{background:rgba(245,158,11,.16);color:#fcd34d;border-color:rgba(245,158,11,.35)}
.b-bad{background:rgba(239,68,68,.16);color:#fca5a5;border-color:rgba(239,68,68,.35)}
.b-info{background:rgba(56,189,248,.16);color:#bae6fd;border-color:rgba(56,189,248,.35)}
.b-muted{background:rgba(255,255,255,.07);color:var(--txt-dim);border-color:rgba(255,255,255,.16)}
.b-pri{background:rgba(16,185,129,.18);color:#a7f3d0;border-color:rgba(16,185,129,.4)}
.b-hrd{background:linear-gradient(135deg,rgba(245,158,11,.2),rgba(251,113,133,.2));color:#fde68a;border-color:rgba(245,158,11,.4)}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;cursor:pointer;border:1px solid var(--glass-brd);border-radius:12px;padding:10px 16px;font-weight:700;font-size:13px;color:var(--txt);background:var(--glass);transition:.15s;white-space:nowrap}
.btn:hover{background:var(--glass2);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-pri{background:var(--grad);border:none;color:#04141d}
.btn-pri:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent}
.btn-acc{background:linear-gradient(135deg,#f59e0b,#fb7185);border:none;color:#1a0f00}
.btn-bad{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.4);color:#fca5a5}
.btn-sm{padding:6px 10px;font-size:12px;font-weight:500;border-radius:9px}
input,select,textarea{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--glass-brd);border-radius:10px;padding:10px 12px;color:var(--txt);font-size:13px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(16,185,129,.18)}
label{font-size:12px;font-weight:600;color:var(--txt-dim);display:block;margin-bottom:6px}
.field{margin-bottom:12px}
.card{padding:18px}
.p24{padding:24px}
.mt{margin-top:14px}.mb{margin-bottom:14px}.mt8{margin-top:8px}.mt-lg{margin-top:24px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
th{color:var(--txt-dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
tr:hover td{background:rgba(255,255,255,.03)}
.hr{height:1px;background:rgba(255,255,255,.1);margin:14px 0}
.kpi{font-size:30px;font-weight:800;letter-spacing:-1px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.5px}
.logo .mark{width:36px;height:36px;border-radius:10px;object-fit:cover;display:block;background:var(--grad);box-shadow:0 6px 18px rgba(16,185,129,.4)}
.nav-link{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--txt-dim);font-size:13px;font-weight:600;cursor:pointer}
.nav-link:hover{background:rgba(255,255,255,.06);color:var(--txt)}
.nav-link.active{background:var(--glass2);color:var(--txt);box-shadow:inset 3px 0 0 var(--primary)}
.nav-sec{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--txt-mut);padding:14px 12px 6px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:80;padding:20px}
.toast{position:fixed;right:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:8px}
.toast .t{padding:12px 16px;border-radius:10px;background:var(--glass2);border:1px solid var(--glass-brd);box-shadow:var(--shadow);font-size:13px;font-weight:600;animation:slidein .25s ease}
@keyframes slidein{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.dot{width:8px;height:8px;border-radius:50%}
.progress{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.progress>span{display:block;height:100%;background:var(--grad)}
.hero-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5}
details>summary{cursor:pointer;padding:8px 0;font-weight:600}
.scroll-x{overflow-x:auto}
.hide{display:none}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#04141d;font-weight:800;font-size:13px}
.divider-v{width:1px;background:rgba(255,255,255,.12);align-self:stretch}
.stripes{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 10px,transparent 10px 20px)}
.kbd{font-family:monospace;background:rgba(0,0,0,.3);padding:2px 6px;border-radius:5px;border:1px solid var(--glass-brd);font-size:11px}
.checkrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.checkbox{width:18px;height:18px;accent-color:var(--primary)}
.tab{padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--txt-dim)}
.tab.active{background:var(--glass2);color:var(--txt)}
.empty{padding:40px;text-align:center;color:var(--txt-mut)}
.home-tile{display:block;text-decoration:none;color:inherit;cursor:pointer;transition:.15s}
.home-tile:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:0 12px 30px -10px rgba(16,185,129,.5)}
.pill-price{font-weight:800;font-size:15px}
.qty{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);border:1px solid var(--glass-brd);border-radius:8px;padding:3px}
.qty button{background:none;border:none;color:var(--txt);cursor:pointer;padding:4px 8px;font-size:14px}
.section-title{display:flex;align-items:center;gap:10px;margin:8px 0 14px}
.section-title .bar{width:4px;height:22px;background:var(--grad);border-radius:4px}
.cert-frame{border:12px double var(--primary);border-radius:14px;padding:40px;background:linear-gradient(160deg,rgba(255,255,255,.97),#f3fff9);color:#062a2f;text-align:center;position:relative}
.cert-frame .seal{position:absolute;right:30px;bottom:24px;width:90px;height:90px;border-radius:50%;background:conic-gradient(var(--accent),var(--primary),var(--accent));display:grid;place-items:center;color:#1a0f00;font-weight:900;font-size:10px}
.steps{counter-reset:step;display:flex;gap:0;flex-wrap:wrap}
.steps .s{flex:1;min-width:120px;position:relative;padding:10px 12px;font-size:11px;color:var(--txt-dim);border-bottom:2px solid rgba(255,255,255,.1)}
.steps .s.active{color:var(--txt);border-color:var(--primary);font-weight:700}
.steps .s.done{color:#86efac;border-color:var(--ok)}
</style>
</head>
<body>
<div class="hero-bg">
  <div class="blob" style="width:420px;height:420px;background:#10b981;top:-120px;left:-80px"></div>
  <div class="blob" style="width:380px;height:380px;background:#22d3ee;top:30%;right:-100px"></div>
  <div class="blob" style="width:340px;height:340px;background:#f59e0b;bottom:-120px;left:40%"></div>
</div>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast"></div>

<script>
/* =====================================================================
   EDU OASIS LMS  —  Dummy Backend (localStorage) + SPA (vanilla JS)
   Per PRD v1.3: Latihan Awam NON-HRD & HRD Claimable (e-TRiS, HRD Corp)
   ===================================================================== */
const VERSION='1.3 (Demo)';
const DB_KEY='edu_oasis_db_v1';
const SESSION_KEY='edu_oasis_session_v1';

/* ---------------- Utilities ---------------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=(p='id')=>p+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const now=()=>new Date().toISOString();
const todayISO=(d=new Date())=>d.toISOString().slice(0,10);
const fmtMYR=n=>'RM '+(Number(n)||0).toLocaleString('ms-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate=s=>{if(!s)return '—';const d=new Date(s);if(isNaN(d))return s;return d.toLocaleDateString('ms-MY',{day:'2-digit',month:'short',year:'numeric'});};
const fmtDateTime=s=>{if(!s)return '—';const d=new Date(s);if(isNaN(d))return s;return d.toLocaleString('ms-MY',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});};
const daysFrom=(iso,n)=>{const d=new Date(iso);d.setDate(d.getDate()+n);return d.toISOString();};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const maskKP=k=>{if(!k)return '—';const s=String(k);return s.length>6? s.slice(0,6)+'-'+s.slice(6).replace(/\d/g,'•')+'•••':s;};
const maskAcct=a=>{const s=String(a||'');return s.length>4?'•••••• '+s.slice(-4):s;};
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const sample=(arr)=>arr[Math.floor(Math.random()*arr.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function toast(msg,type='info'){const r=$('#toast-root');const el=document.createElement('div');el.className='t';const colors={info:'b-info',ok:'b-ok',warn:'b-warn',bad:'b-bad'};el.innerHTML=`<span class="badge ${colors[type]||'b-info'}">${type.toUpperCase()}</span> ${esc(msg)}`;r.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='.3s';setTimeout(()=>el.remove(),300);},3200);}

/* ---------------- Storage-backed dummy DB ---------------- */
const Store={
  load(){try{return JSON.parse(localStorage.getItem(DB_KEY))||null;}catch(e){return null;}},
  save(d){localStorage.setItem(DB_KEY,JSON.stringify(d));},
  clear(){localStorage.removeItem(DB_KEY);localStorage.removeItem(SESSION_KEY);}
};
let DB=null;
function audit(action,entity,entityId,extra=''){
  if(!DB)return;
  DB.auditLogs.unshift({id:uid('al'),userId:Auth.user?Auth.user.id:'system',userName:Auth.user?Auth.user.nama:'Sistem',action,entity,entityId:String(entityId||''),detail:extra,ts:now()});
  Store.save(DB);
}

/* ---------------- Auth ---------------- */
const Auth={
  get user(){try{return JSON.parse(localStorage.getItem(SESSION_KEY))||null;}catch(e){return null;}},
  set user(u){if(u)localStorage.setItem(SESSION_KEY,JSON.stringify(u));else localStorage.removeItem(SESSION_KEY);},
  login(email,pw){
    const u=DB.users.find(x=>x.emel.toLowerCase()===email.toLowerCase() && x.kataLaluan===pw);
    if(!u)return null;
    const sess={id:u.id,nama:u.nama,emel:u.emel,peranan:u.peranan,employerId:u.employerId||null,fotoUrl:u.fotoUrl||null};
    this.user=sess; audit('LOG masuk','User',u.id); return sess;
  },
  logout(){if(this.user)audit('Log keluar','User',this.user.id);this.user=null;},
  has(r){const u=this.user;return u&&u.peranan===r;},
  isOne(...rs){const u=this.user;return u&&rs.includes(u.peranan);}
};

/* ---------------- Service layer (migrates to real backend later) ---------------- */
const S={
  users:{list:()=>DB.users,get:id=>DB.users.find(x=>x.id===id),byEmail:e=>DB.users.find(x=>x.emel.toLowerCase()===e.toLowerCase()),add(u){u.id=uid('usr');u.createdAt=now();u.updatedAt=now();DB.users.push(u);Store.save(DB);audit('Cipta pengguna','User',u.id);return u;},upd(id,p){const u=this.get(id);Object.assign(u,p,{updatedAt:now()});Store.save(DB);return u;},del(id){DB.users=DB.users.filter(x=>x.id!==id);Store.save(DB);audit('Padam pengguna','User',id);}},
  employers:{list:()=>DB.employers,get:id=>DB.employers.find(x=>x.id===id),add(e){e.id=uid('emp');e.createdAt=now();DB.employers.push(e);Store.save(DB);return e;}},
  courses:{list:()=>DB.courses,get:id=>DB.courses.find(x=>x.id===id),published:()=>DB.courses.filter(x=>x.statusPublish),add(c){c.id=uid('crs');c.createdAt=now();DB.courses.push(c);Store.save(DB);audit('Cipta kursus','Course',c.id);return c;},upd(id,p){const c=this.get(id);Object.assign(c,p);Store.save(DB);return c;},del(id){DB.courses=DB.courses.filter(x=>x.id!==id);Store.save(DB);}},
  modules:{forCourse(cid){return DB.modules.filter(m=>m.courseId===cid).sort((a,b)=>a.susunan-b.susunan);},lessons(m){return DB.lessons.filter(l=>l.moduleId===m.id).sort((a,b)=>a.susunan-b.susunan);},allLessons(cid){return DB.modules.filter(m=>m.courseId===cid).flatMap(m=>DB.lessons.filter(l=>l.moduleId===m.id));}},
  sessions:{list:()=>DB.sessions,forCourse(cid){return DB.sessions.filter(s=>s.courseId===cid);},get:id=>DB.sessions.find(x=>x.id===id),add(s){s.id=uid('ses');s.createdAt=now();DB.sessions.push(s);Store.save(DB);return s;},upd(id,p){Object.assign(this.get(id),p);Store.save(DB);}},
  enrollments:{list:()=>DB.enrollments,forUser(uid_){return DB.enrollments.filter(e=>e.userId===uid_);},forCourse(cid){return DB.enrollments.filter(e=>e.courseId===cid);},forSession(sid){return DB.enrollments.filter(e=>e.sessionId===sid);},forEmployer(eid){return DB.enrollments.filter(e=>e.employerId===eid);},get:id=>DB.enrollments.find(x=>x.id===id),add(e){e.id=uid('enr');e.createdAt=now();DB.enrollments.push(e);Store.save(DB);audit('Pendaftaran','Enrollment',e.id);return e;},upd(id,p){Object.assign(this.get(id),p,{updatedAt:now()});Store.save(DB);}},
  attendance:{forSession(sid){return DB.attendance.filter(a=>a.sessionId===sid);},forEnrollment(eid){return DB.attendance.filter(a=>a.enrollmentId===eid);},add(a){a.id=uid('att');a.capMasaBorang=now();DB.attendance.push(a);Store.save(DB);return a;}},
  progress:{forEnrollment(eid){return DB.progress.filter(p=>p.enrollmentId===eid);},toggle(eid,lid){let p=DB.progress.find(x=>x.enrollmentId===eid&&x.lessonId===lid);if(!p){p={id:uid('prg'),enrollmentId:eid,lessonId:lid,selesai:true,tarikhSelesai:now()};DB.progress.push(p);}else{p.selesai=!p.selesai;p.tarikhSelesai=p.selesai?now():null;}Store.save(DB);return p;}},
  quizzes:{forCourse(cid){return DB.quizzes.filter(q=>q.courseId===cid);},get:id=>DB.quizzes.find(x=>x.id===id),attempt(a){a.id=uid('att_q');a.ts=now();DB.attempts.push(a);Store.save(DB);return a;},attemptsFor(uid_,qid){return DB.attempts.filter(x=>x.userId===uid_&&x.quizId===qid);}},
  certificates:{forUser(uid_){return DB.certificates.filter(c=>{const e=DB.enrollments.find(en=>en.id===c.enrollmentId);return e&&e.userId===uid_;});},get:id=>DB.certificates.find(x=>x.id===id),byCode:code=>DB.certificates.find(x=>x.kodPengesahan===code),add(c){c.id=uid('cer');c.tarikhKeluar=now();DB.certificates.push(c);Store.save(DB);audit('Jana e-sijil','Certificate',c.id);return c;},upd(id,p){Object.assign(this.get(id),p);Store.save(DB);}},
  certTemplate:{get:()=>DB.certTemplate,upd(p){Object.assign(DB.certTemplate,p);Store.save(DB);}},
  feedbackTemplate:{get:()=>DB.feedbackTemplate,upd(p){Object.assign(DB.feedbackTemplate,p);Store.save(DB);}},
  feedbackResponses:{forSession(sid){return DB.feedbackResponses.filter(f=>f.sessionId===sid);},forEnrollment(eid){return DB.feedbackResponses.find(f=>f.enrollmentId===eid);},add(r){r.id=uid('fr');r.capMasa=now();DB.feedbackResponses.push(r);Store.save(DB);return r;}},
  feedbackReports:{forSession(sid){return DB.feedbackReports.find(f=>f.sessionId===sid);},get:id=>DB.feedbackReports.find(x=>x.id===id),ensure(sid,trainerId){let r=this.forSession(sid);if(!r){r={id:uid('frp'),sessionId:sid,trainerId,status:'Dianalisis',statistik:{},tema:[],sentimen:{positif:0,neutral:0,negatif:0},penandaIsu:[],ringkasan:'',disemakOleh:null,tarikhDilepaskan:null,diakuiOleh:null};DB.feedbackReports.push(r);Store.save(DB);}return r;},upd(id,p){Object.assign(this.get(id),p);Store.save(DB);}},
  invoices:{list:()=>DB.invoices,get:id=>DB.invoices.find(x=>x.id===id),forUser(uid_){return DB.invoices.filter(i=>i.userId===uid_);},forEmployer(eid){return DB.invoices.filter(i=>i.employerId===eid);},add(i){i.id=uid('inv');i.tarikhTerbit=now();DB.invoices.push(i);Store.save(DB);return i;},upd(id,p){Object.assign(this.get(id),p);Store.save(DB);}},

const R={path:'',go(h){location.hash=h;},init(){window.addEventListener('hashchange',()=>App.render());if(!location.hash)location.hash='#/';}};
function parseHash(){const h=location.hash.replace(/^#/,'')||'/';const parts=h.split('?')[0].split('/').filter(Boolean);return parts;}

/* ---------------- UI helpers ---------------- */
function modal(title,bodyHtml,opts={}){
  const root=$('#modal-root');
  const m=document.createElement('div');m.className='modal-bg';
  m.innerHTML=`<div class="glass-strong" style="max-width:${opts.w||620}px;width:100%;max-height:88vh;overflow:auto;padding:22px">
    <div class="between mb"><div class="h3">${title}</div><button class="btn btn-sm btn-ghost" onclick="closeModal()">✕</button></div>
    ${bodyHtml}</div>`;
  m.addEventListener('click',e=>{if(e.target===m)closeModal();});
  root.appendChild(m);
  return m;
}
function closeModal(){$('#modal-root').innerHTML='';}
function confirmBox(msg,onYes,opts={}){
  modal(opts.title||'Pengesahan Diperlukan',`<p class="muted mb">${msg}</p><div class="row" style="justify-content:flex-end"><button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn ${opts.bad?'btn-bad':'btn-pri'}" id="cfy">${opts.yes||'Sahkan'}</button></div>`);
  $('#cfy').onclick=()=>{closeModal();onYes();};
}
function statusBadge(map,st){const m=map[st]||{t:st,c:'b-muted'};return `<span class="badge ${m.c}">${m.t}</span>`;}
function priceCard(label,amount,active,onClick,note){return `<button class="glass" onclick="${onClick}" style="text-align:left;padding:16px;cursor:pointer;${active?'border-color:var(--primary);box-shadow:0 0 0 3px rgba(16,185,129,.25)':''}">
    <div class="sm muted">${label}</div>
    <div class="pill-price pri mt8">${amount}</div>
    <div class="xs mut mt8">${note||''}</div>
  </button>`;}
function tabs(items,activeKey,onPick){return `<div class="row" style="border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px">${items.map(i=>`<div class="tab ${i.k===activeKey?'active':''}" onclick="${onPick}('${i.k}')">${i.l}</div>`).join('')}</div>`;}
function stepsRow(items,activeIdx){return `<div class="steps mb">${items.map((it,i)=>`<div class="s ${i<activeIdx?'done':i===activeIdx?'active':''}"><div class="xs mut">${i+1}. ${it}</div></div>`).join('')}</div>`;}
function emptyState(msg,icon='📭'){return `<div class="empty"><div style="font-size:36px">${icon}</div><div class="mt8">${msg}</div></div>`;}

    const empUsers=db.users.filter(u=>u.peranan==='MAJIKAN');
    // group registrations: ~half HRD half NON-HRD for eligible courses
    const isHRD=c.layakTuntutanETRiS && Math.random()<0.55;
    const groupEmployer=isHRD?sample(db.employers):null;
    const n=Math.min(c.kuotaDefault, 3+Math.floor(Math.random()*8));
    const picked=sample(pesertaUsers.slice(0,40)).id; // ensure variety
    let pickedList=new Set();
    while(pickedList.size<n){pickedList.add(pesertaUsers[Math.floor(Math.random()*pesertaUsers.length)].id);}
    const enrollIds=[];
    [...pickedList].forEach(uidU=>{
      const u=db.users.find(x=>x.id===uidU);
      const empId=u.employerId||(isHRD?groupEmployer.id:null);
      const en={id:uid('enr'),userId:uidU,sessionId:s.id,courseId:c.id,employerId:empId,jalurYuran:isHRD?'HRD':'NON_HRD',yuranDikenakan:isHRD?c.yuranHRD:c.yuranNonHRD,statusBayaran:isHRD?'DISAHKAN':'DISAHKAN',statusPendaftaran:isHRD?'DISAHKAN':'DISAHKAN',hrdRequestId:null,kehadiranPeratus:0,skorAkhir:null,lulus:null,createdAt:now()};
      db.enrollments.push(en);enrollIds.push(en.id);
    });
    // For HRD session, create HRD request + claim case
    if(isHRD && groupEmployer){
      const hrdStatus=s.status==='tamat'?'Diluluskan':sample(['Menunggu Kelulusan HRD Corp','Dalam Semakan Geran Levi','Penyediaan Dokumen','Dihantar ke HRD Corp']);
      const hr={id:uid('hrd'),noRujukan:genRef('HRD'),employerId:groupEmployer.id,courseId:c.id,sessionId:s.id,bilPeserta:n,status:s.status==='tamat'?'Diluluskan':hrdStatus,adminDitugasan:'admin@eduoasis.my',tempatDipegangHingga:daysFrom(now(),7),hasilSemakanLevi:'Baki levi mencukupi (DUMMY)',catatanLevi:'Semakan manual dilakukan oleh admin.',tarikhHantarHRD:s.status==='tamat'?daysFrom(s.tarikhMula,-3):null,rujukanHRDCorp:s.status==='tamat'?genRef('ETRIS'):'',keputusan:s.status==='tamat'?'LULUS':'',createdAt:now()};
      db.hrdRequests.push(hr);
      db.enrollments.filter(e=>e.sessionId===s.id).forEach(e=>{e.hrdRequestId=hr.id;});
      db.hrdMessages.push({id:uid('hm'),requestId:hr.id,pengirim:'admin',mesej:'Salam, terima kasih. Kami akan semakan baki levi majikan dan kongsikan dokumen sokongan.',ts:daysFrom(now(),-5)});
      db.hrdDocuments.push({id:uid('hd'),requestId:hr.id,jenisDokumen:'Invois Proforma',namaFail:'invois_proforma_'+hr.noRujukan+'.pdf',ts:daysFrom(now(),-4)});
      // Claim case for completed HRD
      if(s.status==='tamat'){
        const cc={id:uid('cc'),sessionId:s.id,employerId:groupEmployer.id,hrdRequestId:hr.id,rujukanETRiS:genRef('ETRIS'),status:sample(['Dokumen Lengkap','Dihantar','Diluluskan']),tarikhAkhir:daysFrom(s.tarikhTamat,90),tarikhHantar:daysFrom(s.tarikhTamat,5),catatan:'Kes tuntutan dalam proses.',createdAt:now()};
        db.claimCases.push(cc);
        const claimDocs=[
          {jenis:'SENARAI_PESERTA',wajib:true,status:'Lengkap',auto:true},
          {jenis:'LEMBARAN_KEHADIRAN',wajib:true,status:'Lengkap',auto:true},
          {jenis:'SERTIFIKAT',wajib:true,status:'Lengkap',auto:true},
          {jenis:'INVOIS_RESIT',wajib:true,status:'Lengkap',auto:true},
          {jenis:'COURSE_PLAN',wajib:true,status:'Lengkap',auto:false},
          {jenis:'SESSION_PLAN',wajib:true,status:'Lengkap',auto:false},
          {jenis:'PENGESAHAN_KEHADIRAN',wajib:true,status:'Draf',auto:false},
          {jenis:'T3',wajib:true,status:'Menunggu Tandatangan',auto:false},
          {jenis:'JD14',wajib:true,status:'Belum Disediakan',auto:false},
        ];
        claimDocs.forEach(cd=>db.claimDocuments.push({id:uid('cd'),claimCaseId:cc.id,jenisDokumen:cd.jenis,wajib:cd.wajib,status:cd.status,sumber:cd.auto?'Sistem (auto)':'Muat naik',versi:'1.0',disediakanOleh:'admin@eduoasis.my',ts:now()}));
      }
    }
    // Invoices + payment proofs for NON-HRD
    if(!isHRD){
      const total=[...pickedList].length*c.yuranNonHRD;
      const inv={id:uid('inv'),noInvois:genRef('INV'),employerId:null,userId:[...pickedList][0]?db.users.find(u=>u.id===[...pickedList][0]).id:null,sessionId:s.id,jumlah:total,cukai:0,status:s.status==='tamat'?'Dibayar':sample(['Menunggu Bukti','Bukti Diterima','Disahkan']),tarikhTerbit:now(),enrollmentIds:enrollIds.slice()};
      db.invoices.push(inv);
      if(s.status!=='akan datang'){
        const pp={id:uid('pp'),invoiceId:inv.id,enrollmentIds:enrollIds.slice(),namaFail:'bukti_bayaran_'+inv.noInvois+'.pdf',tarikhBayar:s.tarikhMula,jumlah:total,kaedah:'Pindahan Bank / IBG',rujukanTransaksi:genRef('TXN'),status:s.status==='tamat'?'DISAHKAN':sample(['DITERIMA','DISAHKAN']),disemakOleh:'finance@eduoasis.my',sebabTolak:'',ts:now()};
        db.paymentProofs.push(pp);
        db.invoices.filter(i=>i.id===inv.id).forEach(i=>{if(pp.status==='DISAHKAN')i.status='Dibayar';});
      }
      // mark enrollments
      db.enrollments.filter(e=>e.sessionId===s.id).forEach(e=>{e.statusBayaran= s.status==='akan datang'?'MENUNGGU_BUKTI':'DISAHKAN';e.statusPendaftaran= s.status==='akan datang'?'MENUNGGU_BUKTI':'DISAHKAN';});
    }
    // Attendance + feedback + certificates for completed sessions
    if(s.status==='tamat'){
      db.enrollments.filter(e=>e.sessionId===s.id).forEach(e=>{
        const u=db.users.find(x=>x.id===e.userId);
        const hadir=Math.random()<0.9;
        const pct=hadir?(80+Math.floor(Math.random()*21)):Math.floor(Math.random()*60);
        e.kehadiranPeratus=pct;
        db.attendance.push({id:uid('att'),enrollmentId:e.id,sessionId:s.id,sessionDate:s.tarikhMula,status:hadir?(Math.random()<0.15?'LEWAT':'HADIR'):'TIADA',namaDiSijil:u.nama,noKP:u.noKP,emel:u.emel,telefon:u.telefon,syarikat:u.employerId?(db.employers.find(em=>em.id===u.employerId)||{}).namaSyarikat:'Individu',jawatan:u.jawatan,capMasaBorang:daysFrom(s.tarikhMula,0.2/24),sumber:'BORANG',dilarasOleh:''});
        if(hadir){
          // feedback
          const skorAspek={kandungan:3+Math.floor(Math.random()*3),jurulatih:3+Math.floor(Math.random()*3),bahan:3+Math.floor(Math.random()*3),penganjuran:3+Math.floor(Math.random()*3),kemudahan:3+Math.floor(Math.random()*3),kerelevanan:3+Math.floor(Math.random()*3)};
          const skorRekomen=Math.floor(Math.random()*4)+7;
          const komen=sample(['Pengisian sangat menarik dan praktikal.','Jurulatih sangat berpengalaman.','Tempoh sedikit terlalu padat.','Bahan kursus boleh diperbaiki.','Sangat membantu kerja harian saya.','Cuti lebih masa untuk latihan amali.']);
          db.feedbackResponses.push({id:uid('fr'),enrollmentId:e.id,sessionId:s.id,skorAspek,skorRekomen,komenTerbuka:{terbaik:komen,penambahbaikan:sample(['Lebih kajian kes','Lebih masa rehat','Lebih bahan rujukan']),cadangan:''},capMasa:now()});
          // progress
          S_dummyProgressForEnr(db,e.id,c.id);
          // certificate if eligible
          if(pct>=c.ambangKehadiran){
            db.certificates.push({id:uid('cer'),enrollmentId:e.id,noSijil:genRef('SIL'),userId:e.userId,kodPengesahan:uid('ver').toUpperCase(),versiTemplat:'1.0',status:'AKTIF',tarikhKeluar:daysFrom(s.tarikhTamat,1),urlPDF:'#cert-'+e.id});
          }
        }
      });
      // feedback report
      const trainerId=s.jurulatihId;
      const fr={id:uid('frp'),sessionId:s.id,trainerId,status:'Dianalisis',statistik:{},tema:[{t:'Kandungan',s:'positif'},{t:'Jurulatih',s:'positif'},{t:'Tempoh',s:'neutral'}],sentimen:{positif:0,neutral:0,negatif:0},penandaIsu:[],ringkasan:'',disemakOleh:null,tarikhDilepaskan:null,diakuiOleh:null};
      const frs=db.feedbackResponses.filter(f=>f.sessionId===s.id);
      fr.statistik={bilanganRespons:frs.length};
      fr.sentimen={positif:Math.ceil(frs.length*0.7),neutral:Math.floor(frs.length*0.2),negatif:frs.length-Math.ceil(frs.length*0.7)-Math.floor(frs.length*0.2)};
      fr.ringkasan='Kursus diterima baik secara keseluruhan. Peserta memuji kandungan dan jurulatih. Cadangan penambahbaikan: lebih masa latihan amali.';
      db.feedbackReports.push(fr);
    }
  });

  /* Trainer documents (course plan/session plan) at various statuses */
  db.trainerProfiles.forEach((t,i)=>{
    db.sessions.filter(s=>s.jurulatihId===t.id).slice(0,2).forEach((s,si)=>{
      const c=db.courses.find(x=>x.id===s.courseId);
      const kinds=[['COURSE_PLAN',c.id],['SESSION_PLAN',null]];
      kinds.forEach((k,ki)=>{
        const statusArr=['Draf','Dihantar','Dalam Semakan','Diluluskan','Perlu Pembetulan'];
        db.trainerDocuments.push({id:uid('td'),trainerId:t.id,jenis:k[0],courseId:k[1]||null,sessionId:k[0]==='SESSION_PLAN'?s.id:null,namaFail:(k[0]==='COURSE_PLAN'?'course_plan':'session_plan')+'_'+c.kod+'.pdf',versi:'1.'+ki,status:sample(statusArr),komenAdmin:Math.random()<0.3?'Sila tambah objektif pembelajaran yang terukur.':'',tarikhAkhir:daysFrom(s.tarikhMula,-7),ts:now()});
      });
    });
  });

  /* Program materials (slide templates + zoom backgrounds) */
  db.programMaterials.push({id:uid('mat'),jenis:'TEMPLAT_SLAID',nama:'Templat Slaid Edu Oasis (Standard)',fail:'templat_slaid_standard_v2.pptx',versi:'2.0',kategori:'STANDARD',aktif:true,createdAt:now()});
  db.programMaterials.push({id:uid('mat'),jenis:'TEMPLAT_SLAID',nama:'Templat Slaid Micro-Session',fail:'templat_slaid_micro_v1.pptx',versi:'1.0',kategori:'MICRO_SESSION',aktif:true,createdAt:now()});
  SeedData.zoomBg.forEach((b,i)=>db.programMaterials.push({id:uid('mat'),jenis:'LATAR_ZOOM',nama:b,fail:'zoom_bg_'+i+'.png',versi:'1.'+i,kategori:'SEMUA',aktif:true,createdAt:now()}));

  /* Claim templates (Borang Pengesahan Kehadiran / T3 / JD14) */
  db.claimTemplates.push({id:uid('ct'),jenis:'PENGESAHAN_KEHADIRAN',nama:'Borang Pengesahan Kehadiran (Templat Edu Oasis)',versi:'1.0',fail:'tpl_pengesahan_kehadiran_v1.docx',pemetaanMedan:['kursus.tajuk','sesi.tarikhMula','majikan.namaSyarikat','peserta.nama','peserta.noKP','peserta.jawatan','kehadiran.status'],aktif:true,createdAt:now()});
  db.claimTemplates.push({id:uid('ct'),jenis:'T3',nama:'Borang T3 (Templat Edu Oasis — DUMMY)',versi:'1.0',fail:'tpl_t3_v1.docx',pemetaanMedan:['kursus.tajuk','jurulatih.nama','jurulatih.kelayakan','sesi.tarikhMula','sesi.tarikhTamat','majikan.namaSyarikat'],aktif:true,createdAt:now()});
  db.claimTemplates.push({id:uid('ct'),jenis:'JD14',nama:'Borang JD14 (Templat Edu Oasis — DUMMY)',versi:'1.0',fail:'tpl_jd14_v1.docx',pemetaanMedan:['kursus.tajuk','majikan.namaSyarikat','majikan.noSSM','sesi.kluster','kos.latihan'],aktif:true,createdAt:now()});

  /* Cert template (single universal) */
  db.certTemplate={versi:'1.0',logo:'EDU OASIS',teksUmum:'Ini diiktiraf bahawa pemegang sijil ini telah menyempurnakan program latihan di bawah dengan jayanya dan memenuhi syarat penyertaan.',namaPenandatangan:'Norliza Hashim',jawatanPenandatangan:'Pengurus Operasi, Edu Oasis',organisasiPenandatangan:'Edu Oasis Training Sdn Bhd',aktif:true};

  /* Feedback template */
  db.feedbackTemplate={versi:'1.0',aspek:[{k:'kandungan',l:'Kualiti kandungan kursus'},{k:'jurulatih',l:'Penyampaian jurulatih'},{k:'bahan',l:'Bahan & nota kursus'},{k:'penganjuran',l:'Penganjuran & pentadbiran'},{k:'kemudahan',l:'Kemudahan / platform'},{k:'kerelevanan',l:'Kerelevanan kepada kerja anda'}],skalaMax:5,skorRekomenMax:10,soalanTerbuka:[{k:'terbaik',l:'Perkara terbaik tentang program ini'},{k:'penambahbaikan',l:'Apakah yang boleh diperbaiki?'},{k:'cadangan',l:'Cadangan topik lain yang anda inginkan'}],aktif:true};

  return db;
}
function S_dummyProgressForEnr(db,enId,cId){const ls=db.lessons.filter(l=>db.modules.some(m=>m.id===l.moduleId&&m.courseId===cId));ls.forEach((l,i)=>{if(Math.random()<0.8)db.progress.push({id:uid('prg'),enrollmentId:enId,lessonId:l.id,selesai:true,tarikhSelesai:now()});});}

const App={
  render(){
    const p=parseHash();
    const path=p[0]||'';
    if(!Auth.user && path!=='login' && !['','katalog','kursus','sah-sijil','daftar'].includes(path)){
      location.hash='#/login';return;
    }
    if(Auth.user && path==='login'){location.hash='#/dashboard';return;}
    let html='';
    if(path==='login'){html=Pages.login();}
    else if(Auth.user){html=Layout.shell(p);}
    else {html=Layout.public(p);}
    $('#app').innerHTML=html;
    window.scrollTo(0,0);
    if(App.after)App.after(p);
  }
};

function courseCard(c){

  return `<div class="glass card" style="display:flex;flex-direction:column;gap:10px;cursor:pointer" onclick="R.go('kursus/${c.id}')">

}

/* ===== Certificate auto-issuance ===== */
function issueCertificateIfEligible(enrollmentId){
  const e=S.enrollments.get(enrollmentId);if(!e)return null;
  const s=S.sessions.get(e.sessionId);const c=S.courses.get(e.courseId);
  if(e.kehadiranPeratus<(c.ambangKehadiran||80))return null;
  const existing=DB.certificates.find(x=>x.enrollmentId===enrollmentId&&x.status==='AKTIF');
  if(existing)return existing;
  const cer=S.certificates.add({enrollmentId:enrollmentId,userId:e.userId,noSijil:genRef('SIL'),kodPengesahan:uid('ver').toUpperCase(),versiTemplat:DB.certTemplate.versi,status:'AKTIF',urlPDF:'#cert-'+enrollmentId});
  return cer;
}

  const e=$('#l_emel').value.trim(),p=$('#l_pw').value;
  const u=Auth.login(e,p);
  if(!u){toast('Emel atau kata laluan salah','bad');return;}
  toast('Selamat datang, '+u.nama,'ok');R.go('dashboard');
};
Pages.forgotPassword=()=>{
  modal('Lupa Kata Laluan',`<p class="sm muted mb">Masukkan emel berdaftar anda. Sistem akan menjana kata laluan baharu dan (pada produksi) menghantarnya ke emel anda.</p>

};
Pages.doForgot=()=>{
  const emel=$('#fp_emel').value.trim();
  if(!emel){toast('Sila masukkan emel','warn');return;}
  const u=S.users.byEmail(emel);
  if(!u){toast('Emel tidak dijumpai dalam akaun DEMO','bad');return;}
  const baru='eo-'+Math.random().toString(36).slice(2,8);
  S.users.upd(u.id,{kataLaluan:baru});
  audit('Reset kata laluan (lupa kata laluan)','User',u.id);
  closeModal();
  modal('Kata Laluan Baharu Dijana',`<div class="badge b-ok mb">✅ Kata laluan baharu berjaya dijana untuk <b>${esc(u.nama)}</b>.</div>
    <div class="glass card" style="text-align:center"><div class="xs mut">Kata laluan sementara (DEMO)</div><div class="kpi" style="font-size:22px;color:var(--primary2)">${esc(baru)}</div></div>

};

/* ===== Enrollment Flow (fee track selection → payment proof / HRD request) ===== */
const EnrollFlow={
  start(courseId){
    const c=S.courses.get(courseId);if(!c)return;
    const sessions=S.sessions.forCourse(c.id).filter(s=>s.status!=='tamat'&&S.enrollments.forSession(s.id).length<s.kuota);
    if(!sessions.length){modal('Tiada Sesi Tersedia',`<p class="muted">Tiada sesi terbuka untuk kursus ini sekarang. Sila kembali kemudian.</p>`);return;}
    const isEmployer=Auth.user.peranan==='MAJIKAN';
    EnrollFlow.state={courseId,sessionId:null,jalur:null};
    EnrollFlow.render();
  },
  render(){
    const st=EnrollFlow.state;const c=S.courses.get(st.courseId);
    const sessions=S.sessions.forCourse(c.id).filter(s=>s.status!=='tamat'&&S.enrollments.forSession(s.id).length<s.kuota);
    const step=st.sessionId?(st.jalur?2:1):0;
    const body=`<div class="steps mb">${stepsRow(['Pilih Sesi','Pilih Jalur Yuran',(st.jalur==='HRD'?'Hubungi Admin':'Borang & Bayaran'),(st.jalur==='HRD'?'Pengesahan HRD':'Pengesahan')],step+ (st.jalur?(st.jalur==='HRD'?3:3):1)).replace(/<div class="steps mb">|<\/div>$/g,'')}</div>
      ${step===0?EnrollFlow.stepSessions(c,sessions):step===1?EnrollFlow.stepTrack(c):st.jalur==='HRD'?EnrollFlow.stepHRDForm(c):EnrollFlow.stepNonHRD(c)}
    `;
    const m=modal('Pendaftaran Kursus: '+c.tajuk,body,{w:680});
  },
  stepSessions(c,sessions){
    return `<div class="h3 mb">1. Pilih Sesi / Kohort</div>
    <table><thead><tr><th></th><th>Kluster</th><th>Tarikh</th><th>Lokasi</th><th>Tempat</th></tr></thead><tbody>
    ${sessions.map(s=>{const taken=S.enrollments.forSession(s.id).length;return `<tr><td><button class="btn btn-sm btn-pri" onclick="EnrollFlow.pickSession('${s.id}')">Pilih</button></td><td>${esc(s.kluster)}</td><td>${fmtDate(s.tarikhMula)}</td><td>${esc(s.lokasi).slice(0,30)}</td><td>${s.kuota-taken}/${s.kuota}</td></tr>`;}).join('')}
    </tbody></table>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn btn-ghost" onclick="closeModal()">Batal</button></div>`;
  },
  pickSession(sid){EnrollFlow.state.sessionId=sid;EnrollFlow.render();},
  stepTrack(c){
    const st=EnrollFlow.state;
    const nonActive=c.jalurNonHRDAktif,hrdActive=c.layakTuntutanETRiS&&c.jalurHRDAktif;
    return `<div class="h3 mb">2. Pilih Jalur Yuran</div>
    <div class="grid g2 mb">
      ${nonActive?priceCard('Jalur NON-HRD',fmtMYR(c.yuranNonHRD),st.jalur==='NON_HRD',`EnrollFlow.setTrack('NON_HRD')`,'Pembayaran sendiri — muat naik bukti bayaran'):`<div class="glass card mut sm">Jalur NON-HRD tidak ditawarkan.</div>`}
      ${hrdActive?priceCard('Jalur HRD Claimable',fmtMYR(c.yuanHRD||c.yuranHRD),st.jalur==='HRD',`EnrollFlow.setTrack('HRD')`,'Tuntutan levi HRD Corp — hubungi admin'):`<div class="glass card mut sm">Jalur HRD tidak ditawarkan.</div>`}
    </div>
    <div class="row" style="justify-content:space-between"><button class="btn btn-ghost" onclick="EnrollFlow.state.sessionId=null;EnrollFlow.render()">← Sesi</button>
    ${st.jalur?`<button class="btn btn-pri" onclick="EnrollFlow.confirmTrack()">Seterusnya →</button>`:''}</div>`;
  },
  setTrack(t){EnrollFlow.state.jalur=t;EnrollFlow.render();},
  confirmTrack(){EnrollFlow.render();},
  stepNonHRD(c){
    const st=EnrollFlow.state;const u=Auth.user;
    const existing=DB.enrollments.find(e=>e.userId===u.id&&e.sessionId===st.sessionId);
    if(existing){return `<div class="badge b-warn mb">Anda sudah berdaftar untuk sesi ini.</div><button class="btn btn-ghost" onclick="closeModal()">Tutup</button>`;}
    return `<div class="h3 mb">3. Borang Peserta & Bayaran (NON-HRD)</div>
    <div class="field"><label>Nama Penuh (seperti pada sijil)</label><input id="en_nama" value="${esc(u.nama)}"></div>
    <div class="grid g2"><div class="field"><label>No. KP / Pasport</label><input id="en_kp" value="${esc(u.noKP||'')}"></div><div class="field"><label>Telefon</label><input id="en_tel" value="${esc(u.telefon||'')}"></div></div>
    <div class="field"><label>Jawatan</label><input id="en_jaw" value="${esc(u.jawatan||'')}"></div>
    <div class="glass card"><div class="between"><div><div class="xs mut">Yuran NON-HRD</div><div class="pill-price pri">${fmtMYR(c.yuranNonHRD)}</div></div><div class="badge b-info">Invois rasmi dijana oleh e-boss</div></div></div>
    <div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn btn-ghost" onclick="EnrollFlow.state.jalur=null;EnrollFlow.render()">← Jalur</button>
    <button class="btn btn-pri" onclick="EnrollFlow.submitNonHRD()">Daftar & Bayar</button></div>`;
  },
  submitNonHRD(){
    const st=EnrollFlow.state;const c=S.courses.get(st.courseId);const s=S.sessions.get(st.sessionId);const u=Auth.user;
    const en=S.enrollments.add({userId:u.id,sessionId:st.sessionId,courseId:c.id,employerId:u.employerId||null,jalurYuran:'NON_HRD',yuranDikenakan:c.yuranNonHRD,statusBayaran:'MENUNGGU_BUKTI',statusPendaftaran:'MENUNGGU_BUKTI',hrdRequestId:null,kehadiranPeratus:0,skorAkhir:null,lulus:null});
    audit('Pendaftaran NON-HRD','Enrollment',en.id);
    closeModal();toast('Pendaftaran berjaya! Sila muat naik bukti bayaran (invois dari e-boss).','ok');
    R.go('invois-saya');
  },
  stepHRDForm(c){
    const st=EnrollFlow.state;const u=Auth.user;const s=S.sessions.get(st.sessionId);
    const emp=u.employerId?S.employers.get(u.employerId):null;
    return `<div class="h3 mb">3. Jalur HRD — Borang Majikan</div>
    <div class="badge b-hrd mb">⚠ Tiada pembayaran diperlukan pada peringkat ini. Sistem akan cipta <b>Permohonan HRD</b> dan anda perlu menghubungi admin Edu Oasis.</div>
    <div class="grid g2">
      <div class="field"><label>Nama Syarikat</label><input id="h_nama" value="${esc(emp?emp.namaSyarikat:'')}"></div>
      <div class="field"><label>No. SSM</label><input id="h_ssm" value="${esc(emp?emp.noSSM:'')}"></div>
      <div class="field"><label>ID Majikan HRD Corp</label><input id="h_hrd" value="${esc(emp?emp.idMajikanHRDCorp:'')}"></div>
      <div class="field"><label>Bilangan Peserta</label><input id="h_bil" type="number" value="1" min="1"></div>
    </div>
    <div class="field"><label>Senarai Peserta (manual / CSV)</label>
      <textarea id="h_csv" rows="4" placeholder="Nama, No. KP, Emel, Jawatan (satu per baris)&#10;atau tampal CSV"></textarea>
      <div class="xs mut">Bil. peserta dalam senarai mesti sepadan dengan bilangan di atas.</div>
    </div>
    <div class="glass card"><div class="between"><div><div class="xs mut">Yuran HRD Claimable (untuk tuntutan levi)</div><div class="pill-price accent">${fmtMYR(c.yuranHRD)}</div></div><div class="xs mut">Bayaran dituntut melalui levi HRD Corp selepas kelulusan</div></div></div>
    <div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn btn-ghost" onclick="EnrollFlow.state.jalur=null;EnrollFlow.render()">← Jalur</button>
    <button class="btn btn-acc" onclick="EnrollFlow.submitHRD()">Cipta Permohonan HRD</button></div>`;
  },
  submitHRD(){
    const st=EnrollFlow.state;const c=S.courses.get(st.courseId);const s=S.sessions.get(st.sessionId);const u=Auth.user;
    const bil=parseInt($('#h_bil').value)||1;
    const empId=u.employerId||S.employers.add({namaSyarikat:$('#h_nama').value,noSSM:$('#h_ssm').value,idMajikanHRDCorp:$('#h_hrd').value+' (DUMMY)',alamat:'',picNama:u.nama,picEmel:u.emel,picPhone:'',bakiLevi:0}).id;
    const hr=S.hrdRequests.add({noRujukan:genRef('HRD'),employerId:empId,courseId:c.id,sessionId:st.sessionId,bilPeserta:bil,status:'Permintaan Baharu',adminDitugasan:'',tempatDipegangHingga:daysFrom(now(),DB.settings.tempatDipegangHari||7),hasilSemakanLevi:'',catatanLevi:'',tarikhHantarHRD:null,rujukanHRDCorp:'',keputusan:''});
    // create enrollments pending HRD approval
    const csv=$('#h_csv').value.trim().split('\n').filter(l=>l.trim());
    for(let i=0;i<bil;i++){
      const line=csv[i]?csv[i].split(',').map(x=>x.trim()):[];
      S.enrollments.add({userId:u.id,sessionId:st.sessionId,courseId:c.id,employerId:empId,jalurYuran:'HRD',yuranDikenakan:c.yuranHRD,statusBayaran:'DISAHKAN',statusPendaftaran:'HRD_PROSES',hrdRequestId:hr.id,kehadiranPeratus:0,namaPesonertaCsv:line[0]||'',noKPCsv:line[1]||'',emelCsv:line[2]||'',jawatanCsv:line[3]||''});
    }
    S.hrdMessages.add({requestId:hr.id,pengirim:'majikan',mesej:'Permohonan baru dihantar. Sila hubungi admin untuk semakan geran levi.',ts:now()});
    audit('Cipta Permohonan HRD (jalur HRD)','HRDRequest',hr.id);
    closeModal();toast('Permohonan HRD dicipta. Sila hubungi admin.','ok');
    R.go('permohonan-hrd');
  }
};

Pages.submitQuiz=(cid,eid,qid)=>{
  const q=S.quizzes.get(qid);const e=S.enrollments.get(eid);const u=Auth.user;
  const ans=window.QUIZ_ANS||{};
  let score=0;q.soalan.forEach(s=>{if(ans[s.id]===s.jawapanBetul)score++;});
  const pct=Math.round(score/q.soalan.length*100);
  S.quizzes.attempt({userId:u.id,quizId:qid,enrollmentId:eid,skor:score,skorPct:pct,lulus:pct>=q.skorLulus,answers:Object.assign({},ans)});
  S.enrollments.upd(eid,{skorAkhir:pct,lulus:pct>=q.skorLulus});
  audit('Hantar kuiz','Quiz',qid,'Skor '+pct+'%');
  modal('Keputusan Kuiz',`<div style="text-align:center"><div style="font-size:48px">${pct>=q.skorLulus?'🏆':'📉'}</div><div class="xl">${pct}%</div><div class="muted">${score}/${q.soalan.length} betul · Ambang lulus ${q.skorLulus}%</div><div class="mt"><span class="badge ${pct>=q.skorLulus?'b-ok':'b-bad'}">${pct>=q.skorLulus?'LULUS':'GAGAL'}</span></div><button class="btn btn-pri mt" onclick="closeModal();R.go('kursus-saya')">Selesai</button></div>`);
};

Pages.parseCSV=(input)=>{
  const f=input.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const lines=r.result.split(/\r?\n/).filter(l=>l.trim());const body=$('#g_body');body.innerHTML='';
  let start=0;if(lines[0]&&/nama/i.test(lines[0])&&/noKP/i.test(lines[0]))start=1;
  for(let i=start;i<lines.length;i++){const c=lines[i].split(',').map(x=>x.trim());Pages.addRow(c[0]||'',c[1]||'',c[2]||'',c[3]||'');}
  toast(lines.length-start+' peserta diimport','ok');};
  r.readAsText(f);
};

Pages.addRow=(n,k,e,j)=>{
  const rid=uid('r');
  $('#g_body').insertAdjacentHTML('beforeend',`<tr id="${rid}"><td><input value="${esc(n)}"></td><td><input value="${esc(k)}"></td><td><input value="${esc(e)}"></td><td><input value="${esc(j)}"></td><td><button class="btn btn-sm btn-bad" onclick="document.getElementById('${rid}').remove()">✕</button></td></tr>`);
};
Pages.submitGroup=(empId)=>{
  const cid=$('#g_crs').value,sid=$('#g_ses').value,jalur=$('#g_jalur').value;
  if(!sid){toast('Pilih sesi','warn');return;}
  const c=S.courses.get(cid);const s=S.sessions.get(sid);
  const rows=$$('#g_body tr');const pax=[];
  rows.forEach(r=>{const inp=r.querySelectorAll('input');if(inp.length>=4&&inp[0].value.trim())pax.push({nama:inp[0].value.trim(),noKP:inp[1].value.trim(),emel:inp[2].value.trim(),jawatan:inp[3].value.trim()});});
  if(!pax.length){toast('Tambah sekurang-kurangnya satu peserta','warn');return;}
  const taken=S.enrollments.forSession(sid).length;
  if(taken+pax.length>s.kuota){toast('Kuota tidak mencukupi ('+(s.kuota-taken)+' tempat tinggal)','warn');return;}
  if(jalur==='HRD'){
    const curEmp=Auth.user.employerId?S.employers.get(Auth.user.employerId):null;
    const eid=empId||(curEmp?curEmp.id:S.employers.add({namaSyarikat:curEmp?curEmp.namaSyarikat:'Majikan',noSSM:curEmp?curEmp.noSSM:'DUMMY (simulasi)',idMajikanHRDCorp:'HRD-DUMMY',picNama:Auth.user.nama,picEmel:Auth.user.emel,bakiLevi:0}).id);
    const hr=S.hrdRequests.add({noRujukan:genRef('HRD'),employerId:eid,courseId:cid,sessionId:sid,bilPeserta:pax.length,status:'Permintaan Baharu',adminDitugasan:'',tempatDipegangHingga:daysFrom(now(),7),hasilSemakanLevi:'',catatanLevi:'',tarikhHantarHRD:null,rujukanHRDCorp:'',keputusan:''});
    pax.forEach(px=>S.enrollments.add({userId:Auth.user.id,sessionId:sid,courseId:cid,employerId:eid,jalurYuran:'HRD',yuranDikenakan:c.yuranHRD,statusBayaran:'DISAHKAN',statusPendaftaran:'HRD_PROSES',hrdRequestId:hr.id,kehadiranPeratus:0,namaPesertaCsv:px.nama,noKPCsv:px.noKP,emelCsv:px.emel,jawatanCsv:px.jawatan}));
    S.hrdMessages.add({requestId:hr.id,pengirim:'majikan',mesej:'Pendaftaran kumpulan '+pax.length+' peserta. Sila hubungi admin.',ts:now()});
    audit('Daftar kumpulan HRD','HRDRequest',hr.id);
    toast('Permohonan HRD dicipta untuk '+pax.length+' peserta. Hubungi admin.','ok');R.go('permohonan-hrd');
  }else{
    const total=pax.length*c.yuranNonHRD;
    const enIds=[];const eid=empId||null;
    pax.forEach(px=>{const en=S.enrollments.add({userId:Auth.user.id,sessionId:sid,courseId:cid,employerId:eid,jalurYuran:'NON_HRD',yuranDikenakan:c.yuranNonHRD,statusBayaran:'MENUNGGU_BUKTI',statusPendaftaran:'MENUNGGU_BUKTI',kehadiranPeratus:0,namaPesertaCsv:px.nama,noKPCsv:px.noKP,emelCsv:px.emel,jawatanCsv:px.jawatan});enIds.push(en.id);});
    const inv=S.invoices.add({noInvois:genRef('INV'),employerId:eid,userId:Auth.user.id,sessionId:sid,jumlah:total,cukai:0,status:'Menunggu Bukti',enrollmentIds:enIds});
    audit('Daftar kumpulan NON-HRD','Invoice',inv.id);
    toast('Pendaftaran '+pax.length+' peserta. Invois dijana.','ok');R.go('invois-saya');
  }
};

Pages.showQR=(sid)=>{const s=S.sessions.get(sid);const url=location.origin+location.pathname+'#/borang-kehadiran/'+s.borangKehadiranToken;
  // simple deterministic QR-like grid
  let g='';const seed=s.borangKehadiranToken;for(let i=0;i<25;i++){let row='';for(let j=0;j<25;j++){const v=(seed.charCodeAt((i*25+j)%seed.length)+i*j)%3;row+=v<2?'<td style="background:#04141d"></td>':'<td></td>';}g+='<tr>'+row+'</tr>';}
  modal('QR Borang Kehadiran',`<div style="text-align:center"><table style="margin:0 auto;border-collapse:collapse;border:8px solid #fff;background:#fff">${g}</table><div class="xs mut mt8">Pautan: <span class="kbd">${esc(url)}</span></div><button class="btn btn-sm btn-ghost mt8" onclick="navigator.clipboard&&navigator.clipboard.writeText('${url.replace(/'/g,"\\'")}');toast('Disalin','ok')">Salin Pautan</button></div>`,{w:420});};

    ${DB.claimCases.map(cc=>{const docs=S.claimCases.documents(cc.id);const done=docs.filter(d=>d.status==='Lengkap').length;const s=S.sessions.get(cc.sessionId);const c=S.courses.get(s.courseId);const emp=S.employers.get(cc.employerId);return `<tr><td>${esc(c.tajuk)}</td><td>${esc(emp?emp.namaSyarikat:'—')}</td><td><div class="progress" style="width:140px"><span style="width:${Math.round(done/docs.length*100)}%"></span></div> ${done}/${docs.length}</td><td>${bc(cc.status)}</td></tr>`;}).join('')}
    </tbody></table>
    <button class="btn btn-sm btn-ghost mt8" onclick="Pages.exportReport()">⬇ Eksport Laporan (CSV)</button></div>`;
};
Pages.exportReport=()=>{const csv='Laporan Ringkas\n\nMetrik,Nilai\nPendaftaran,'+DB.enrollments.length+'\nKutipan,'+DB.invoices.filter(i=>i.status==='Dibayar').reduce((s,i)=>s+i.jumlah,0)+'\nSijil,'+DB.certificates.length+'\nKes Tuntutan,'+DB.claimCases.length+'\n';const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Laporan_EduOasis.csv';a.click();toast('Laporan dieksport','ok');};

/* ===== KEWANGAN + SUPER ADMIN ===== */
Pages['invois']=()=>{return `<div class="glass card"><div class="section-title"><div class="bar"></div><div class="h3">Invois — Platform e-Boss</div></div>
  <div class="badge b-info mb">ℹ Penjanaan invois rasmi dikendali oleh platform <b>e-boss</b> luaran.</div>
  <p class="muted mb">Pengurusan invois (penjanaan, nombor, resit rasmi, cukai SST) tidak dilakukan dalam LMS Edu Oasis. Ini diasingkan ke <b>e-boss</b> supaya LMS memberi tumpuan kepada: katalog program, data jurulatih, pengurusan pengguna/peranan, dan pendaftaran peserta.</p>
  <p class="muted mb">Tugas kewangan dalam LMS terhad kepada <b>pengesahan bukti bayaran</b> yang dimuat naik peserta selepas bayar mengikut invois dari e-boss. Sila gunakan menu <a href="#/sah-bayaran" class="pri" style="font-weight:600">💰 Pengesahan Bayaran</a>.</p>
  <div class="xs mut">Untuk akses e-boss, hubungi pentadbir sistem kewangan.</div>
</div>`;};
Pages['pengguna']=()=>{
  const roles=['','PESERTA','MAJIKAN','JURULATIH','ADMIN','KEWANGAN','SUPER_ADMIN'];
  App.after=()=>{Pages.renderUsers();const q=$('#u_q'),rf=$('#u_role_filter');if(q)q.oninput=Pages.renderUsers;if(rf)rf.onchange=Pages.renderUsers;};
  return `<div class="glass card"><div class="between"><div class="section-title" style="margin:0"><div class="bar"></div><div class="h3">Pengguna & Peranan (${DB.users.length})</div></div><button class="btn btn-sm btn-pri" onclick="Pages.addUser()">➕ Pengguna Baharu</button></div>
    <div class="row mb" style="align-items:flex-end">
      <div class="field" style="flex:1;min-width:220px;margin:0"><label>Cari pengguna (nama / emel / jawatan)</label><input id="u_q" placeholder="🔍 cth. JURULATIH, Ahmad, admin@…"></div>
      <div class="field" style="min-width:200px;margin:0"><label>Tapis Peranan</label><select id="u_role_filter"><option value="">Semua peranan</option>${roles.slice(1).map(r=>`<option value="${r}">${r}</option>`).join('')}</select></div>
      <button class="btn btn-ghost btn-sm" onclick="$('#u_q').value='';$('#u_role_filter').value='';Pages.renderUsers()">Reset</button>
    </div>
    <table><thead><tr><th>Nama</th><th>Emel</th><th>Peranan</th><th>Jawatan</th><th>No. KP</th><th>Tindakan</th></tr></thead><tbody id="u_tbody"></tbody></table></div>`;
};
Pages.renderUsers=()=>{
  const q=(($('#u_q')&&$('#u_q').value)||'').trim().toLowerCase();
  const rf=($('#u_role_filter')&&$('#u_role_filter').value)||'';
  let list=DB.users.filter(u=>{
    if(rf&&u.peranan!==rf)return false;
    if(q){const s=(u.nama+' '+u.emel+' '+(u.jawatan||'')+' '+u.peranan+' '+(u.noKP||'')).toLowerCase();if(!s.includes(q))return false;}
    return true;
  });
  const tb=$('#u_tbody');if(!tb)return;
  tb.innerHTML=list.length?list.map(u=>`<tr><td>${esc(u.nama)}</td><td>${esc(u.emel)}</td><td><span class="badge b-info">${u.peranan}</span></td><td>${esc(u.jawatan||'—')}</td><td>${esc(maskKP(u.noKP))}</td><td><button class="btn btn-sm btn-ghost" onclick="Pages.editUser('${u.id}')">Sunting</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty" style="padding:24px">Tiada pengguna sepadan dengan carian.</div></td></tr>`;
};
Pages.addUser=()=>Pages.editUser('');
Pages.editUser=(id)=>{const u=id?S.users.get(id):{nama:'',emel:'',kataLaluan:'password',peranan:'PESERTA',noKP:'',telefon:'',jawatan:'',employerId:null};const roles=['PESERTA','MAJIKAN','JURULATIH','ADMIN','KEWANGAN','SUPER_ADMIN'];modal('Pengguna: '+(id?'Sunting':'Baharu'),`<div class="grid g2"><div class="field"><label>Nama</label><input id="u_nama" value="${esc(u.nama)}"></div><div class="field"><label>Emel</label><input id="u_emel" value="${esc(u.emel)}"></div><div class="field"><label>Peranan</label><select id="u_role">${roles.map(r=>`<option ${r===u.peranan?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label>No. KP</label><input id="u_kp" value="${esc(u.noKP)}"></div></div><button class="btn btn-pri" onclick="Pages.saveUser('${id||''}')">Simpan</button><button class="btn btn-ghost" onclick="closeModal()">Batal</button>`,{w:560});};
Pages.saveUser=(id)=>{const data={nama:$('#u_nama').value,emel:$('#u_emel').value,peranan:$('#u_role').value,noKP:$('#u_kp').value};if(id)S.users.upd(id,data);else S.users.add(Object.assign({kataLaluan:'password',telefon:'',jawatan:'',employerId:null,fotoUrl:null},data));closeModal();toast('Pengguna disimpan','ok');R.go('pengguna');};
Pages['tetapan']=()=>{
  const s=DB.settings;
  return `<div class="glass card"><div class="section-title"><div class="bar"></div><div class="h3">Tetapan Sistem</div></div>
    <div class="grid g2">
      <div class="field"><label>Yuran Micro-Session (RM)</label><input id="s_micro" type="number" value="${s.microFee}"></div>
      <div class="field"><label>Ambang Kehadiran (%)</label><input id="s_amb" type="number" value="${s.ambangKehadiran}"></div>
      <div class="field"><label>Tempoh Tempat Dipegang HRD (hari)</label><input id="s_hold" type="number" value="${s.tempatDipegangHari}"></div>
      <div class="field"><label>Tempoh Respons Bayaran (hari)</label><input id="s_resp" type="number" value="${s.tempohResponsBayaran}"></div>
    </div>
    <div class="field"><label>Akaun Bank Edu Oasis</label><input id="s_bank" value="${esc(s.bankEdu.bank+' | '+s.bankEdu.namaPemegang+' | '+s.bankEdu.noAkaun)}"></div>
    <div class="field"><label>Dasar Pembatalan</label><textarea id="s_cancel" rows="2">${esc(s.dasarPembatalan)}</textarea></div>
    <button class="btn btn-pri" onclick="Pages.saveSettings()">Simpan Tetapan</button>
  </div>
  <div class="glass card mt">
    <div class="section-title"><div class="bar"></div><div class="h3">Notis & Polisi PDPA (Akta 2010)</div></div>
    <div class="sm muted mb">Ini adalah bahagian untuk mengurus fail Notis Perlindungan Data Peribadi (PDPA) yang dipaparkan pada borang pendaftaran peserta. Naik taraf fail di sini apabila polisi dikemas kini.</div>
    <div class="grid g2">
      <div class="field"><label>Fail Notis PDPA Semasa</label><input id="s_pdpa" value="${esc(s.pdpaFail||'PDPA_Notis_Edu_Oasis.pdf')}" readonly></div>
      <div class="field"><label>Versi / Tarikh Pindaan</label><input id="s_pdpa_v" value="${esc(s.pdpaVersi||'v1.0')+' / '+(s.pdpaTarikh||'16 Nov 2026')}"></div>
    </div>
    <div class="field"><label>Muat Naik Fail PDPA Baharu (PDF)</label><input type="file" id="s_pdpa_file" accept="application/pdf,.pdf" onchange="Pages.pickPdpaFile(this)"></div>
    <div class="row">
      <a class="btn btn-ghost" href="${esc(s.pdpaFail||'PDPA_Notis_Edu_Oasis.pdf')}" target="_blank" rel="noopener">📄 Pratonton Fail Semasa ↗</a>
      <button class="btn btn-pri" onclick="Pages.savePdpa()">Simpan Fail PDPA</button>
    </div>
    <div class="xs mut mt8">⚠ DEMO: fail disimpan sebagai nama fail dalam data tetapan. Pada produksi, fail PDF dimuat naik ke storan selamat (cth. S3/OSS) dan pautan pendaftaran dikemaskini secara automatik.</div>
  </div>`;
};
Pages.pickPdpaFile=(inp)=>{const f=inp.files&&inp.files[0];if(f){$('#s_pdpa').value=f.name;toast('Fail dipilih: '+f.name,'info');}};
Pages.savePdpa=()=>{const fail=$('#s_pdpa').value.trim()||'PDPA_Notis_Edu_Oasis.pdf';const v=$('#s_pdpa_v').value.trim();S.settings.upd({pdpaFail:fail,pdpaVersi:v});audit('Kemaskini fail PDPA','Settings','pdpa');toast('Fail PDPA dikemaskini','ok');R.go('tetapan');};
Pages.saveSettings=()=>{S.settings.upd({microFee:parseFloat($('#s_micro').value),ambangKehadiran:parseInt($('#s_amb').value),tempatDipegangHari:parseInt($('#s_hold').value),tempohResponsBayaran:parseInt($('#s_resp').value),dasarPembatalan:$('#s_cancel').value});toast('Tetapan disimpan','ok');};
Pages['audit']=()=>{return `<div class="glass card"><div class="section-title"><div class="bar"></div><div class="h3">Log Audit (${DB.auditLogs.length})</div></div>
  <table><thead><tr><th>Tarikh/Masa</th><th>Pengguna</th><th>Tindakan</th><th>Entiti</th><th>ID</th></tr></thead><tbody>
  ${DB.auditLogs.slice(0,100).map(a=>`<tr><td>${fmtDateTime(a.ts)}</td><td>${esc(a.userName)}</td><td>${esc(a.action)}</td><td>${esc(a.entity)}</td><td class="xs mut">${esc(a.entityId)}</td></tr>`).join('')}
  </tbody></table></div>`;};
Pages['reset']=()=>{return `<div class="glass-strong card"><div class="section-title"><div class="bar"></div><div class="h3">Reset Data Dummy</div></div>
  <div class="badge b-warn mb">⚠ Tindakan ini akan memadam semua data demo dan menjana semula data contoh (DUMMY).</div>
  <div class="row"><button class="btn btn-bad" onclick="Pages.doReset()">Reset & Jana Semula Data</button><button class="btn" onclick="Pages.doLogout()">Log Keluar</button></div>
  <div class="hr"></div>
  <div class="h3 mb">Akaun Demo</div>
  <table><thead><tr><th>Peranan</th><th>Emel</th><th>Kata Laluan</th></tr></thead><tbody>
    ${[['Super Admin','superadmin@eduoasis.my','super123'],['Pentadbir Kursus','admin@eduoasis.my','admin123'],['Pegawai Kewangan','finance@eduoasis.my','finance123'],['Majikan/HR','hr1@techsolutions.com.my','hr123'],['Jurulatih','aimanfauzi@eduoasis.my','trainer123'],['Peserta','ahmad1@example.com','peserta123']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><span class="kbd">${r[2]}</span></td></tr>`).join('')}
  </tbody></table></div>`;};
Pages.doReset=()=>{confirmBox('Reset semua data dummy? Tindakan ini tidak boleh diundur.',()=>{Store.clear();DB=seed();Store.save(DB);Auth.logout();toast('Data dummy dijana semula','ok');R.go('login');},{bad:true,yes:'Reset Sekarang'});};
Pages.doLogout=()=>{Auth.logout();R.go('login');};


/* ---------------- Init ---------------- */
function boot(){
  DB=Store.load();
  if(!DB){DB=seed();Store.save(DB);}
  R.init();
  App.render();
}
boot();
</script>
</body>
</html>
